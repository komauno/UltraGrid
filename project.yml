name: UltraGrid
options:
  bundleIdPrefix: com.ultragrid
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  UltraGrid:
    type: application
    platform: macOS
    sources:
      - path: Sources/UltraGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultragrid.app
        PRODUCT_NAME: UltraGrid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/UltraGrid/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/UltraGrid/UltraGrid.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        # ウィンドウ操作にはサンドボックス無効が必須（他アプリを制御するため）。
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
